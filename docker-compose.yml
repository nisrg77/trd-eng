version: '3.8'

services:
  # Next.js Frontend Dashboard (Port 3000)
  frontend:
    build: ./frontend
    container_name: trdeng-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - ws-server

  # The FastAPI WebSocket Server (Port 8000)
  ws-server:
    build: .
    container_name: trdeng-ws-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["python", "services/ws_server.py"]
    depends_on:
      - redis

  # The Execution Backend / Orchestrator
  backend-engine:
    build: .
    container_name: trdeng-backend-engine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["python", "services/run_backend.py"]
    depends_on:
      - redis


  # Redis (Optional but recommended for messaging/state)
  redis:
    image: redis:7-alpine
    container_name: trdeng-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # -------------------------------------------------------------
  # Isolated RL Subsystem (PyTorch / SB3 / Streamlit Dashboard)
  # -------------------------------------------------------------
  rl-trainer:
    build:
      context: .
      dockerfile: Dockerfile.rl
    container_name: trdeng-rl-trainer
    restart: unless-stopped
    volumes:
      - ./model_weights:/app/model_weights
      - ./middleware:/app/middleware
    command: ["python", "-c", "from research.rl.live_paper_trainer import LivePaperTrainer, LivePaperTrainerConfig; LivePaperTrainer(LivePaperTrainerConfig()).start_live_session()"]

  rl-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.rl
    container_name: trdeng-rl-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./model_weights:/app/model_weights
      - ./middleware:/app/middleware
    command: ["streamlit", "run", "research/rl/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    depends_on:
      - rl-trainer


